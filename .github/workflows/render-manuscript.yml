name: Render food-inflation manuscript

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'food-inflation-risk/**'
      - '.github/workflows/render-manuscript.yml'
  push:
    branches: [master]
    paths:
      - 'food-inflation-risk/**'
      - '.github/workflows/render-manuscript.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-inflation-risk
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: food-inflation-risk
          extra-packages: any::ggplot2, any::dplyr, any::readr, any::tidyr, any::scales, any::lubridate
          needs: check

      - name: Generate figures with ggplot2
        run: Rscript code/R/make_figures.R

      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: food-inflation-risk/manuscript
          root_file: main.tex

      - uses: xu-cheng/latex-action@v3
        with:
          working_directory: food-inflation-risk/protocol
          root_file: protocol.tex

      - uses: actions/upload-artifact@v4
        with:
          name: food-inflation-risk-manuscript
          path: |
            food-inflation-risk/manuscript/main.pdf
            food-inflation-risk/protocol/protocol.pdf
            food-inflation-risk/manuscript/figures/*.pdf
            food-inflation-risk/manuscript/figures/*.png
